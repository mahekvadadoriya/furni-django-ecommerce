{% extends 'seller_base.html' %}
{%  load static %}
{% block content %}
		    

        <!-- Page Content -->
        <div id="page-content-wrapper" class="w-100" style="overflow-y: auto; height: 100vh;">
            <div class="container-fluid p-4 p-md-5">
                
                <div class="mb-4">
                    <a href=" {% url 'seller_profile' %}" class="text-decoration-none text-muted mb-3 d-inline-block"><i class="bi bi-arrow-left me-2"></i>Back to Profile</a>
                    <h2 class="fw-bold page-title m-0">Edit Profile</h2>
                    <p class="text-muted">Manage your personal information and store details.</p>
                </div>

                <div class="row g-4">
                    <!-- Left Column: Form -->
                    <div class="col-lg-8">
                        <div class="card border-0 shadow-sm rounded-4 mb-4">
                            <div class="card-body p-4 p-md-5">
                                <h5 class="fw-bold mb-4">Personal Details</h5>
                                <form action="" method="POST">
                                    {% csrf_token %}
                                    <div class="row mb-4">
                                        <div class="col-md-6">
                                            <label class="form-label fw-medium text-muted">First Name</label>
                                            <input type="text" name="name" class="form-control bg-light border-0 shadow-none p-3" value="{{sellerdata.user.username}}">
                                        </div>
                                        <!-- <div class="col-md-6 mt-4 mt-md-0">
                                            <label class="form-label fw-medium text-muted">Last Name</label>
                                            <input type="text" class="form-control bg-light border-0 shadow-none p-3" value="Doe">
                                        </div> -->
                                    </div>
                                    
                                    <div class="row mb-4">
                                        <div class="col-md-6">
                                            <label class="form-label fw-medium text-muted">Email Address</label>
                                            <input type="email" name="email" class="form-control bg-light border-0 shadow-none p-3" value="{{user.email}}">
                                        </div>
                                        <div class="col-md-6 mt-4 mt-md-0">
                                            <label class="form-label fw-medium text-muted">Phone Number</label>
                                            <input type="tel" name="mobile" class="form-control bg-light border-0 shadow-none p-3" value="{{sellerdata.mobile}}">
                                        </div>
                                    </div>
                                    
                                    <hr class="my-5 border-light">
                                    
                                    <h5 class="fw-bold mb-4">Store Information</h5>
                                    
                                    <div class="mb-4">
                                        <label class="form-label fw-medium text-muted">Store Name</label>
                                        <input type="text" name="company" class="form-control bg-light border-0 shadow-none p-3" value="{{sellerdata.company}}">
                                    </div>
                                    
                                    <!-- <div class="mb-4">
                                        <label class="form-label fw-medium text-muted">Store Description / Bio</label>
                                        <textarea class="form-control bg-light border-0 shadow-none p-3" rows="4">We sell premium electronics and top-tier tech accessories to professionals and enthusiasts.</textarea>
                                    </div> -->
                                    
                                    <div class="mb-4">
                                        <label class="form-label fw-medium text-muted">Business Address</label>
                                         
                                        <input type="text" class="form-control bg-light border-0 shadow-none p-3" name="address" value="{{sellerdata.address}}">

                                          <label class="form-label fw-medium text-muted">City</label>
                                        <input type="text" class="form-control bg-light border-0 shadow-none p-3" name="city" value="{{sellerdata.city}}">

                                          <label class="form-label fw-medium text-muted">State</label>
                                        <input type="text" class="form-control bg-light border-0 shadow-none p-3" name="state" value="{{sellerdata.state}}">

                                          <label class="form-label fw-medium text-muted">Country</label>
                                        <input type="text" class="form-control bg-light border-0 shadow-none p-3" name="country" value="{{sellerdata.country}}">

                                    </div>

                                    <div class="d-flex justify-content-end gap-3 mt-5">
                                        <a href=" {% url 'seller_profile' %}" class="btn btn-light px-4 py-2">Discard Changes</a>
                                        <button type="submit" class="btn btn-primary-custom px-4 py-2">Save Changes</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column: Profile Image -->
                    <!-- <div class="col-lg-4">
                        <div class="card border-0 shadow-sm rounded-4">
                            <div class="card-body p-4 text-center">
                                <h5 class="fw-bold mb-4 text-start">Profile Picture</h5>
                                
                                <div class="position-relative d-inline-block mb-4">
                                    <div class="avatar bg-primary text-white rounded-circle d-flex justify-content-center align-items-center fw-bold shadow-sm mx-auto" style="width: 120px; height: 120px; font-size: 2.5rem;">
                                        JD
                                    </div>
                                    <button class="btn btn-sm btn-light position-absolute bottom-0 end-0 rounded-circle shadow-sm" style="width: 35px; height: 35px; padding: 0;" onclick="document.getElementById('profileImageInput').click();">
                                        <i class="bi bi-camera text-primary"></i>
                                    </button>
                                    <input type="file" id="profileImageInput" style="display: none;" accept="image/*">
                                </div>
                                
                                <p class="text-muted small mb-4">Allowed file types: png, jpg, jpeg. Maximum file size: 2MB.</p>
                            </div>
                        </div>
                    </div> -->
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
{% endblock %}
