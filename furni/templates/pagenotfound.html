{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

    body{
        background:#f8f9fa;
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .error-card{
        max-width:600px;
        width:100%;
        border:none;
        border-radius:20px;
    }

    .error-code{
        font-size:100px;
        font-weight:700;
        color:#3B5D50;
        line-height:1;
    }

    .btn-dashboard{
        background:#3B5D50;
        color:white;
        border:none;
        padding:12px 30px;
        border-radius:10px;
    }

    .btn-dashboard:hover{
        background:#2f4b40;
        color:white;
    }

</style>

</head>

<body>

<div class="card shadow-lg error-card">

    <div class="card-body text-center p-5">

        <div class="error-code">
            404
        </div>

        <h2 class="fw-bold mt-3">
            Page Not Found
        </h2>

        <p class="text-muted mt-3">
            The page you are looking for may have been removed,
            renamed, or is temporarily unavailable.
        </p>

        <div class="mt-4">

            {% if dashboard %}

                <a href="{% url dashboard %}" class="btn btn-dashboard">
                    Back 
                </a>

            {% else %}
                <a href="admin/" class="btn btn-dashboard">
                    Admin
                </a>

            {% endif %}
        </div>

    </div>

</div>

</body>
</html>
