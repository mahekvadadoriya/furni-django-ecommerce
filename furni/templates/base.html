{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="author" content="Untree.co">
  <link rel="shortcut icon" href="{% static 'images/favicon.png' %}">

  <meta name="description" content="" />
  <meta name="keywords" content="bootstrap, bootstrap4" />

		<!-- Bootstrap CSS -->
		<link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
		<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
		<link href="{% static 'css/tiny-slider.css' %}" rel="stylesheet">
		<link href="{% static 'css/style.css' %}" rel="stylesheet">
		<title>Furni  </title>
	</head>

	<body>

		
		<!-- Start Header/Navigation -->
		{% include 'partials/navbar.html' %}
		{% if not request.path|slice:":7" == "/admin/" %}
			{% include "search_bar.html" %}
		{% endif %}
		{% block content %}


		{% endblock %}


		<!-- Start Footer Section -->
		{% include 'partials/footer.html' %}
		<!-- End Footer Section -->	


		<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
		<script src="{% static 'js/tiny-slider.js' %}"></script>
		<script src="{% static 'js/custom.js' %}"></script>
		<script>
			document.addEventListener("DOMContentLoaded", function () {

    		const paymentModes =
        	document.querySelectorAll('input[name="payment_method"]');

			const transactionBox =
				document.getElementById("transaction-box");

			function toggleTransactionBox() {

				const selected =
					document.querySelector('input[name="payment_method"]:checked');

				if (selected && selected.value === "UPI") {
					transactionBox.style.display = "block";
				}
				else {
					transactionBox.style.display = "none";
				}
			}

			toggleTransactionBox();

			paymentModes.forEach(function (radio) {
				radio.addEventListener("change", toggleTransactionBox);
			});

			});	
		</script>
	</body>

</html>
