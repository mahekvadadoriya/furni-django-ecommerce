{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Furni Seller Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        :root {
            --primary-color: #3b5d50;
            --primary-hover: #2f4a40;
            --sidebar-bg: #3B5D50;
            --sidebar-text: #ffffff;
            --bg-color: #eef2f1;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body{
            background:var(--bg-color);
            min-height:100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .auth-wrapper{
            min-height:100vh;
        }

        .portal-title{
            color:var(--primary-color);
            font-size:42px;
            font-weight:700;
            margin-bottom:5px;
        }

        .portal-subtitle{
            color:#6c757d;
            font-size:15px;
        }

        .seller-card{
            background:var(--card-bg);
            border:none;
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 10px 35px rgba(0,0,0,.08);
        }

        .seller-header{
            background:var(--primary-color);
            color:white;
            text-align:center;
            padding:40px 30px;
        }

        .seller-header i{
            font-size:48px;
            margin-bottom:15px;
        }

        .seller-header h3{
            font-size:30px;
            margin:0;
            font-weight:600;
        }

        .seller-header p{
            margin-top:8px;
            margin-bottom:0;
            opacity:.9;
        }

        .form-label{
            font-weight:600;
            color:var(--text-color);
        }

        .form-control{
            height:52px;
            border-radius:10px;
        }

        .form-control:focus{
            border-color:var(--primary-color);
            box-shadow:0 0 0 .2rem rgba(59,93,80,.15);
        }

        .seller-btn{
            background:var(--primary-color);
            color:white;
            border:none;
            height:52px;
            border-radius:10px;
            font-weight:600;
            transition:.3s;
        }

        .seller-btn:hover{
            background:var(--primary-hover);
            color:white;
        }

        .seller-link{
            color:var(--primary-color);
            text-decoration:none;
            font-weight:600;
        }

        .seller-link:hover{
            color:var(--primary-hover);
        }

        .alert{
            border-radius:10px;
        }

    </style>

</head>

<body>

<div class="container auth-wrapper">

    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-lg-6 col-md-8">

            <div class="text-center mb-4">

                <div class="portal-title">
                    Furni Seller Portal
                </div>

                <div class="portal-subtitle">
                    Manage Products, Orders & Business Growth
                </div>

            </div>

            {% block content %}
            {% endblock %}

        </div>

    </div>

</div>

</body>
</html>
