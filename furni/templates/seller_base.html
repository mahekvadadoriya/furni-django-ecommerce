{% load static %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{% static 'images/favicon.png' %}">
    <title>Furni Seller</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'seller/css/seller_style.css' %}">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-4 mb-3">
                <h3 class="fw-bold text-white mb-0"><i class="bi bi-shop me-2"></i>  Seller</h3>



                  <a href=" {% url 'seller_profile' %}" class="list-group-item list-group-item-action">
                    <i class="bi bi-person me-3 fs-5"></i>{{ request.user.username }}
                   
                </a>
            </div>
                <div class="list-group list-group-flush mt-2">

                <a href="{% url 'seller_index' %}"
                class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'seller_index' %}active{% endif %}">
                    <i class="bi bi-grid me-3 fs-5"></i> Dashboard
                </a>

                <a href="{% url 'seller_orders' %}"
                class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'seller_orders' %}active{% endif %}">
                    <i class="bi bi-cart3 me-3 fs-5"></i> Orders
                </a>

               <a href="{% url 'seller_products' %}"
                    class="list-group-item list-group-item-action
                    {% if 'seller_product' in request.resolver_match.url_name %}active{% endif %}">
                        <i class="bi bi-box-seam me-3 fs-5"></i> Products
                </a>

                <a href="{% url 'seller_analytics' %}"
                class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'seller_analytics' %}active{% endif %}">
                    <i class="bi bi-graph-up me-3 fs-5"></i> Analytics
                </a>

            </div>
            <div class="sidebar-footer">
                <a href="{% url 'seller_logoutpage' %}" class="list-group-item list-group-item-action">
                    <i class="bi bi-box-arrow-left me-3 fs-5"></i> Logout
                </a>
            </div>
        </div>

        {% block content %}


		{% endblock %}
