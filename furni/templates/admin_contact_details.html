{% extends 'admin_base.html' %}
{% load static %}
{% block content %}

<div id="page-content-wrapper" class="w-100">

<div class="container-fluid p-4 p-md-5">

<div class="card border-0 shadow rounded-4">

<div class="card-header bg-white">

<h3>

Contact Details

</h3>

</div>

<div class="card-body">

<div class="mb-4">

<label class="fw-bold">

Name

</label>

<p>

{{ contact.firstname }}
{{ contact.lastname }}

</p>

</div>

<div class="mb-4">

<label class="fw-bold">

Email

</label>

<p>

{{ contact.email }}

</p>

</div>

<div class="mb-4">

<label class="fw-bold">

Received On

</label>

<p>

{{ contact.created_at|date:"d M Y H:i" }}

</p>

</div>

<div class="mb-4">

<label class="fw-bold">

Message

</label>

<div class="border rounded p-3 bg-light">

{{ contact.message }}

</div>

</div>

<a
href="{% url 'admin_contacts' %}"
class="btn btn-success">

Back

</a>

</div>

</div>

</div>

</div>

{% endblock %}
